# Manual only, so the cluster never gets created (and billed) by accident.
# Auth uses OIDC federated credentials: no client secret stored in GitHub.
name: Infra (Terraform)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment for an approval gate
    environment: azure
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=shopdemo-dev.tfstate"

      - name: Plan
        if: inputs.action != 'destroy'
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan

      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
