# Deploys the microservices to AKS. Run after the Infra workflow has applied.
name: Deploy to AKS

on:
  workflow_dispatch:
    inputs:
      overlay:
        description: "Kustomize overlay"
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Write RabbitMQ credentials from GitHub secrets
        run: |
          {
            echo "RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}"
            echo "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}"
          } > k8s/base/rabbitmq.env

      - name: Deploy
        run: kubectl apply -k k8s/overlays/${{ inputs.overlay }}

      - name: Wait for rollout
        run: |
          ns=store-${{ inputs.overlay }}
          kubectl -n $ns rollout status statefulset/rabbitmq --timeout=300s
          kubectl -n $ns wait --for=condition=Available deployment --all --timeout=300s
          kubectl -n $ns get pods,svc
