apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: store-prod

resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml

labels:
  - pairs:
      environment: prod
    includeSelectors: false

replicas:
  - name: store-front
    count: 2
  - name: order-service
    count: 2
  - name: product-service
    count: 2

patches:
  # Expose the shop publicly through an Azure Load Balancer
  - target:
      kind: Service
      name: store-front
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
