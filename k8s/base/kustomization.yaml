apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rabbitmq.yaml
  - order-service.yaml
  - product-service.yaml
  - store-front.yaml

# Single place to bump the application version
images:
  - name: ghcr.io/azure-samples/aks-store-demo/order-service
    newTag: "2.2.0"
  - name: ghcr.io/azure-samples/aks-store-demo/product-service
    newTag: "2.2.0"
  - name: ghcr.io/azure-samples/aks-store-demo/store-front
    newTag: "2.2.0"

labels:
  - pairs:
      app.kubernetes.io/part-of: aks-store
    includeSelectors: false

# rabbitmq.env is git-ignored. Create it from rabbitmq.env.example.
secretGenerator:
  - name: rabbitmq-credentials
    envs:
      - rabbitmq.env
