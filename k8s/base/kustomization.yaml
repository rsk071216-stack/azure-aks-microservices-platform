apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rabbitmq.yaml
  - order-service.yaml
  - product-service.yaml
  - store-front.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: aks-store
    includeSelectors: false

# rabbitmq.env is git-ignored. Create it from rabbitmq.env.example.
secretGenerator:
  - name: rabbitmq-credentials
    envs:
      - rabbitmq.env
